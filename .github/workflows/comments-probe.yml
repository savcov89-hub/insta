name: comments-probe
on:
  push:
    branches: [claude/project-thread-9j0b59]
    paths: [publisher/comments_probe.py, .github/workflows/comments-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 publisher/comments_probe.py
