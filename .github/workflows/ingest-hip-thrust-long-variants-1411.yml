name: Ingest final long hip thrust variants
on:
  push:
    paths:
      - '.github/workflows/ingest-hip-thrust-long-variants-1411.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ingest-hip-thrust-long-variants
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Transfer verified finished MP4 files and queue two trial Reels
        shell: bash
        env:
          VIDEO_A: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-0b74-81f5-a7dc-092980dcab19/raw?se=2026-11-12T15%3A07%3A19Z&sp=r&sv=2026-06-06&sr=b&scid=a9b53339-ffba-571c-9ae2-c18257c4f240&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T14%3A09%3A34Z&ske=2026-11-13T14%3A09%3A34Z&sks=b&skv=2026-06-06&sig=XLYhQ3dD%2BwPX27LOapZO26hLOSob3v0oks3eOCtDzL0%3D"
          VIDEO_B: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-e5c4-81f5-89bc-4b42ec311cf0/raw?se=2026-11-12T15%3A07%3A25Z&sp=r&sv=2026-06-06&sr=b&scid=d504f333-a5f9-5978-9aa6-4cf8dea7839e&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T12%3A52%3A56Z&ske=2026-11-13T12%3A52%3A56Z&sks=b&skv=2026-06-06&sig=yfe8I4iof4pIIO5H2OhmVnPoPmwfNyR85oksYQhE7Pw%3D"
        run: |
          set -euo pipefail
          if [ -f queue/hip-thrust-quads-v2-1411.json ] && [ -f queue/hip-thrust-vectors-v3-1411.json ]; then
            echo 'Both variants already queued'
            exit 0
          fi
          git config user.name 'reels-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 "$VIDEO_A" -o /tmp/hip_thrust_variant_A_long.mp4
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 "$VIDEO_B" -o /tmp/hip_thrust_variant_B_long.mp4
          echo '34e7864ee505d592cca4b453182274cdc87242901c0697d9bd95d19753df0cb9  /tmp/hip_thrust_variant_A_long.mp4' | sha256sum -c -
          echo '5b030faebb4a9c370740225fbaf2ebc1095a584eca26845281f28c707be574b7  /tmp/hip_thrust_variant_B_long.mp4' | sha256sum -c -
          mkdir -p queue
          commits=()
          for id in A B; do
            file="/tmp/hip_thrust_variant_${id}_long.mp4"
            blob="$(git hash-object -w "$file")"
            name="hip_thrust_variant_${id}_long.mp4"
            tree="$(printf '100644 blob %s\t%s\n' "$blob" "$name" | git mktree)"
            commit="$(echo "Approved hip thrust variant $id 2026-11-14" | git commit-tree "$tree")"
            if [ "$id" = A ]; then branch='media/hip-thrust-quads-v2-1411'; else branch='media/hip-thrust-vectors-v3-1411'; fi
            git push origin "$commit":refs/heads/"$branch"
            commits+=("$commit")
          done
          python3 - "${commits[@]}" <<'PY'
          import pathlib,json,sys
          rows=[{"id":"hip-thrust-quads-v2-1411","file":"hip_thrust_variant_A_long.mp4","sha":"34e7864ee505d592cca4b453182274cdc87242901c0697d9bd95d19753df0cb9","caption":"Болит или устаёт передняя поверхность бедра в ягодичном мосте? Причина может быть в постановке стоп и меняющемся плече внешней силы относительно колена. В простой плоской модели рисуем линию реакции опоры и перпендикуляр от центра сустава к ней. Если линия ближе к колену, плечо сокращается. Но чувства жжения — не прямой измеритель механического напряжения. Сравнивай также контроль, амплитуду и устойчивость.\n\nПо исследованию Collazo García и соавторов, при более дальней постановке стоп сигнал квадрицепса был ниже. ЭМГ не доказывает преимущество по росту мышц и не означает, что квадрицепс выключается.\n\nИсследование: Collazo García et al., 2020, Journal of Strength and Conditioning Research, DOI 10.1519/JSC.0000000000002859.\n\n#ягодичныймост #биомеханика #квадрицепс #ягодицы #техникаупражнений"},{"id":"hip-thrust-vectors-v3-1411","file":"hip_thrust_variant_B_long.mp4","sha":"5b030faebb4a9c370740225fbaf2ebc1095a584eca26845281f28c707be574b7","caption":"Стопы в ягодичном мосте могут оставаться на месте, а направление усилия меняться. Опора отвечает вертикальной и горизонтальной составляющими, их векторная сумма даёт результирующую. От коленного и тазобедренного суставов проводим перпендикуляры к линии её действия — так наглядно показывается плечо внешней силы.\n\nЭто упрощённая модель: на туловище действует реакция скамьи, есть масса сегментов, вес штанги и ускорение. Поэтому одна стрелка не определяет реальную активность или рост отдельных мышц.\n\nИсследование: Brazil et al., 2021, PLOS ONE, DOI 10.1371/journal.pone.0249307.\n\n#ягодичныймост #биомеханика #векторсилы #мышцы #техникаупражнений"}]
          for item,ref in zip(rows,sys.argv[1:]):
            video_url=f"https://raw.githubusercontent.com/savcov89-hub/insta/{ref}/{item['file']}"
            q={"publish_at":"2026-11-14T14:00:00+07:00","trial":True,"graduation":"MANUAL","cover_ms":1500,"video_url":video_url,"media_branch":"media/"+item["id"],"caption":item["caption"]}
            path=pathlib.Path("queue")/(item['id']+".json")
            path.write_text(json.dumps(q,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
            print("queued",path)
          PY
          git add queue/hip-thrust-quads-v2-1411.json queue/hip-thrust-vectors-v3-1411.json
          git commit -m 'queue: 2 long hip thrust variants Sat Nov 14 14:00 Novosibirsk'
          git pull -q --rebase origin main
          git push origin HEAD:main
