# Выгружает подписи рилсов и постов профиля из lookup/profile.txt и коммитит в lookup/.
name: lookup
on:
  push:
    paths: ['lookup/profile.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: list
        run: |
          pip install -q -U yt-dlp instaloader
          p=$(head -1 lookup/profile.txt)
          (yt-dlp --flat-playlist -J "https://www.instagram.com/$p/reels/" > lookup/ytdlp-reels.json 2> lookup/ytdlp-reels.err || true)
          (yt-dlp --flat-playlist -J "https://www.instagram.com/$p/" > lookup/ytdlp-profile.json 2> lookup/ytdlp-profile.err || true)
          (timeout 600 instaloader --no-pictures --no-videos --no-video-thumbnails --no-profile-pic --comments=false --max-connection-attempts 1 --post-metadata-txt='{caption}' --count 400 -- "$p" > lookup/instaloader.log 2>&1 || true)
          (grep -ril -e opensim -e "open sim" -e sumo "$p" > lookup/hits.txt 2>/dev/null || true)
          ls -la lookup; tail -5 lookup/*.err lookup/instaloader.log
      - name: commit
        run: |
          git config user.name "lookup-bot"; git config user.email "actions@github.com"
          git add -A lookup "bretcontreras1" 2>/dev/null || git add -A lookup
          git commit -q -m "lookup: результаты" || exit 0
          git push -q
