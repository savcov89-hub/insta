name: read-comments
on:
  push:
    branches: ['claude/project-thread-q94f95']
    paths: ['.github/workflows/comments.yml']
permissions:
  contents: read
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: read
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DAYS: '7'
        run: python3 publisher/probe.py
