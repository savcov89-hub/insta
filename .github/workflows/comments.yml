# Читает комментарии к Reels за последние дни и печатает их в лог (в файлы не пишет).
name: read-comments
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'за сколько дней'
        default: '7'
permissions:
  contents: read
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: read
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
        run: python3 publisher/comments.py
