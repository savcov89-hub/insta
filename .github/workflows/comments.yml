# Раз в сутки собирает комментарии под Reels → comments/comments.json (только читает Instagram).
name: read-comments
on:
  schedule:
    - cron: '7 2 * * *'     # 09:07 по Новосибирску
  workflow_dispatch:
concurrency:
  group: comments
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 20
      - name: comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "reels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 publisher/comments.py
