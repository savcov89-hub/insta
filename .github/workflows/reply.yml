# Отправляет одобренные Михаилом ответы на комментарии. Только по кнопке, расписания нет.
# Уходит ответ, только если его id в поле ids И в comments/drafts.json у него status "approved".
name: reply-comments
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'id комментариев через запятую'
        required: true
      approve:
        description: 'запуск кнопкой «Ответить» в календаре: нажатие = одобрение Михаила (только для одного id)'
        type: boolean
        default: false
      text:
        description: 'исправленный текст ответа (необязательно, только для одного id)'
        required: false
        default: ''
      dry_run:
        description: 'только проверить, ничего не отправлять'
        type: boolean
        default: false
concurrency:
  group: comments
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - name: reply
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IDS: ${{ inputs.ids }}
          APPROVE: ${{ inputs.approve && '1' || '0' }}
          TEXT: ${{ inputs.text }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          git config user.name "reels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 publisher/reply.py
