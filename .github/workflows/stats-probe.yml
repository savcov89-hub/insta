# Временная проверка сборщика статистики на ветке: цифры коммитятся в эту же ветку, не в main.
# Удаляется перед слиянием.
name: stats-probe
on:
  push:
    branches: [claude/project-thread-ppyj7d]
    paths: [publisher/stats.py, .github/workflows/stats-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GIT_PUSH: '0'
        run: |
          git config user.name "reels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main && git checkout -q FETCH_HEAD -- status queue
          python3 publisher/stats.py
          git reset -q
          git add stats
          git commit -q -m "stats: пробный сбор на ветке"
          git push -q origin HEAD:claude/project-thread-ppyj7d
