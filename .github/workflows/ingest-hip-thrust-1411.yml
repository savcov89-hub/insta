name: Ingest approved hip thrust reel 2026-11-14
on:
  push:
    paths:
      - '.github/workflows/ingest-hip-thrust-1411.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hip-thrust-recut-1411-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
      - name: Safely ingest and enqueue approved MP4
        env:
          VIDEO_SOURCE: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-5510-81f5-9514-fe52cfa961a8/raw?se=2026-11-12T14%3A04%3A08Z&sp=r&sv=2026-06-06&sr=b&scid=096deb4c-dbe2-5525-b2fd-39f768e97e99&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T12%3A11%3A44Z&ske=2026-11-13T12%3A11%3A44Z&sks=b&skv=2026-06-06&sig=Rlso/xRHNZq1pbBpvYicZhJTzbjbp18bKNPWEhd%2BDlA%3D"
        run: |
          set -euo pipefail
          if [ -f queue/hip-thrust-recut-1411.json ]; then echo 'Already queued'; exit 0; fi
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 "$VIDEO_SOURCE" -o /tmp/hip_thrust_recut.mp4
          echo '5296b903e8090124e498d3fa5e912cefe631d27acca3fa9b244ef7be92e72310  /tmp/hip_thrust_recut.mp4' | sha256sum -c -
          git config user.name 'reels-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob="$(git hash-object -w /tmp/hip_thrust_recut.mp4)"
          tree="$(printf '100644 blob %s\thip_thrust_recut.mp4\n' "$blob" | git mktree)"
          commit="$(echo 'Media: hip thrust recut approved for Nov 14' | git commit-tree "$tree")"
          git push -f origin "$commit":refs/heads/media/hip-thrust-recut-1411
          python3 - "$commit" <<'PY_SCRIPT'
          import json,sys
          id="hip-thrust-recut-1411"
          sha=sys.argv[1]
          q={"publish_at":"2026-11-14T14:00:00+07:00","trial":True,"graduation":"MANUAL","cover_ms":1500,"video_url":f"https://raw.githubusercontent.com/savcov89-hub/insta/{sha}/hip_thrust_recut.mp4","media_branch":"media/hip-thrust-recut-1411","caption":"Куда ставить стопы в ягодичном мосте — ближе или дальше?\n\nЕсть две разные настройки: положение стоп и направление усилия. Они меняют геометрию и плечи силы относительно коленного и тазобедренного суставов.\n\nСмотри на стрелки в ролике: линия действия реакции опоры, её наклон и перпендикулярные плечи до суставов. Именно поэтому одна и та же постановка стоп может давать разные ощущения в мышцах.\n\nВажно: ЭМГ не измеряет напрямую рост мышц, а ощущения нагрузки не всегда отражают реальный суставной момент.\n\n#ягодичныймост #ягодицы #биомеханика #техникаупражнений #силовыетренировки"}
          with open("queue/"+id+".json","w",encoding="utf-8") as f: json.dump(q,f,ensure_ascii=False,indent=2);f.write("\n")
          PY_SCRIPT
          git add queue/hip-thrust-recut-1411.json
          git commit -m 'queue: hip thrust recut 14 Nov 14:00 Novosibirsk'
          git pull -q --rebase origin main
          git push origin HEAD:main
